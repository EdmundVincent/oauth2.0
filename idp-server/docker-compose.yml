services:
  db:
    build:
      context: .
      dockerfile: dockerfile.db
    image: idp-db
    container_name: idp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - idp-network

  redis:
    build:
      context: .
      dockerfile: dockerfile.reids
    image: idp-redis
    container_name: idp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - idp-network

  server:
    build:
      context: .
      dockerfile: dockerfile.server
    image: idp-server
    container_name: idp-server
    restart: unless-stopped
    environment:
      MYSQL_HOST: idp-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      REDIS_HOST: idp-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      APP_ENV: dev
      SESSION_TTL: 8h
      ISSUER: http://localhost:8080
      LISTEN_ADDR: :8080
      SIGNING_KEY_DIR: scripts/dev_keys
      SIGNING_KEY_CHECK_INTERVAL: 1h
      SIGNING_KEY_ROTATE_BEFORE: 24h
      SIGNING_KEY_RETIRE_AFTER: 24h
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz | grep -q 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - idp-network

  sbapp-client:
    build:
      context: ../sbapp-client
      dockerfile: Dockerfile
    image: sbapp-client
    container_name: sbapp-client
    restart: unless-stopped
    environment:
      IDP_PUBLIC_BASE_URL: http://localhost:8080
      IDP_INTERNAL_BASE_URL: http://idp-server:8080
      IDP_CLIENT_ID: sbapp
      IDP_CLIENT_SECRET: sbapp-secret-123
      IDP_REDIRECT_URI: http://localhost:8081/callback
      IDP_POST_LOGOUT_REDIRECT_URI: http://localhost:8081/logged-out
    ports:
      - "8081:8081"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - idp-network

networks:
  idp-network:
    name: idp-network
    driver: bridge

volumes:
  mysql-data:
  redis-data:
